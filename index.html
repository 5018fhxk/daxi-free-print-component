<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>实际记录打印</title><link rel="stylesheet" href="print.css?v=11"></head><body><nav><strong>实际记录打印</strong><p id="status" role="status">请从飞书应用的打印组件打开。</p><section id="setup" hidden><label>数据表 <select id="bases" aria-label="选择数据表"></select></label><label>记录类型 <select id="source" aria-label="选择实际记录类型"><option value="business">实际出入库记录</option><option value="workstation">工位回仓与转移记录</option><option value="repair">工位设备检修记录</option></select></label><button id="configure">连接实际记录</button></section><section id="handoff-selection" hidden><h2>勾选本次交接物品</h2><p>只列本人已办理、尚未归单的测试物品。同一申请本次交接可多选，分次交接另建一张。</p><div class="selection-actions"><p id="selection-count">已选0项</p><button id="save-selection" disabled>保存本次选择</button></div><div id="selection-list"></div><p id="selection-status" role="status"></p></section><select id="records" hidden aria-label="选择实际交接记录"></select><button id="reload" hidden>刷新记录</button><button id="print" disabled>打印 / 保存PDF</button><details><summary>查看记录说明</summary><p>按当前账号权限读取已确认记录；【保存本次选择】仅新建交接选择清单，不修改出入库事实或库存。历史记录没有独立交接批次时逐条打印；不会把同一申请的分次交接拼成一张。</p></details></nav><main id="paper" class="paper" hidden></main><script type="module" src="app.mjs?v=11"></script></body></html>
